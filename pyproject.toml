[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chartools"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
chartools = "chartools:app"

[tool.setuptools]
py-modules = ["chartools"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "daemon*"]
